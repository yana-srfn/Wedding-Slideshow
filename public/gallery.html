<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Memory Garden | Dilla & Syam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="slideshow-body">

    <div
        class="flower-rain"
        id="flowerRain"
        aria-hidden="true"
    ></div>

    <main class="slideshow-page">

        <header class="slideshow-header">

            <div>
                <p class="slideshow-couple">
                    Dilla & Syam
                </p>

                <h1>Live Memory Garden</h1>
            </div>

            <div class="live-status">
                <span class="live-dot"></span>
                Live
            </div>

        </header>

        <section
            class="slideshow-stage"
            id="slideshowStage"
        >

            <div
                class="slideshow-empty"
                id="slideshowEmpty"
            >
                <span>✿</span>

                <h2>
                    Waiting for memories to bloom
                </h2>

                <p>
                    New photos and videos will appear here automatically.
                </p>
            </div>

            <div
                class="slideshow-slide"
                id="slideshowSlide"
            >

                <div
                    class="slideshow-media"
                    id="slideshowMedia"
                ></div>

                <div class="slideshow-details">

                    <p
                        class="slideshow-message"
                        id="slideshowMessage"
                    ></p>

                    <p class="slideshow-guest">
                        shared by
                        <strong id="slideshowGuest"></strong>
                    </p>

                </div>

            </div>

        </section>

        <footer class="slideshow-footer">

            <p>
                made with love by dayana ♡
            </p>

            <div class="slideshow-progress">

                <span id="currentSlideNumber">0</span>

                <span>/</span>

                <span id="totalSlideNumber">0</span>

            </div>

        </footer>

    </main>

    <script src="js/gallery.js"></script>

</body>
</html>
